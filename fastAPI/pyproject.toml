[project]
name = "enterprise-api"
version = "0.1.0"
description = "A simplified enterprise FastAPI service"
readme = "README.md"
authors = [
    { name = "echo", email = "q804815006@foxmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
