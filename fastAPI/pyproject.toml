[project]
name = "enterprise-api"
version = "0.1.0"
description = "A simplified enterprise FastAPI service"
readme = "README.md"
authors = [
    { name = "echo", email = "q804815006@foxmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "greenlet>=3.2.0",
    "sqlalchemy>=2.0.0",
    "openai>=2.53.0",
    "fastembed>=0.9.0",
    "pgvector>=0.5.1",
    "langchain-text-splitters>=1.1.3",
    "tokenizers>=0.23.3",
    "github-copilot-sdk>=1.0.28",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
